# portmap dashboard + an agent for this same machine.
# All settings live in .env next to this file (see .env.example).
services:
  portmap:
    image: ghcr.io/solcredio-admin/portmap-server:latest
    container_name: portmap
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.5
    pids_limit: 64
    logging: {driver: json-file, options: {max-size: 1m, max-file: "2"}}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${PORTMAP_PORT:-8080}:8080"
    environment:
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      AGENT_TOKEN: ${AGENT_TOKEN:?set AGENT_TOKEN in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      TRUST_PROXY: ${TRUST_PROXY:-0}
    volumes:
      - portmap-data:/data
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]

  portmap-agent:
    image: ghcr.io/solcredio-admin/portmap-agent:latest
    container_name: portmap-agent
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 16
    logging: {driver: json-file, options: {max-size: 1m, max-file: "2"}}
    network_mode: host
    pid: host
    cap_drop: [ALL]
    cap_add: [SYS_PTRACE, DAC_READ_SEARCH]
    security_opt: [no-new-privileges:true, apparmor:unconfined]
    read_only: true
    environment:
      SERVER_URL: http://${BIND_ADDR:-127.0.0.1}:${PORTMAP_PORT:-8080}
      AGENT_TOKEN: ${AGENT_TOKEN:?set AGENT_TOKEN in .env}
      HOST_NAME: ${HOST_NAME:-}
      SEND_CMDLINE: ${SEND_CMDLINE:-1}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/os-release:/host/os-release:ro
    depends_on: [portmap]

volumes:
  portmap-data:

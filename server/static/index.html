<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portmap</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" type="image/png" href="/favicon.png?v={{V}}">
<link rel="icon" type="image/png" href="/favicon-dark.png?v={{V}}" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v={{V}}">
<script src="/theme.js"></script>
<link rel="modulepreload" href="/app.js?v={{V}}">
<link rel="preload" href="/logo-liquid.png?v={{V}}" as="image">
</head>
<body>
<div id="scene" aria-hidden="true"></div>
<div id="intro" data-liquid="/logo-liquid.png?v={{V}}"><div class="intro-stage"><div class="liquid"><img class="mark only-light" src="/logo-light.png?v={{V}}" alt="" decoding="sync"><img class="mark only-dark" src="/logo-dark.png?v={{V}}" alt="" decoding="sync"></div></div></div>
<header class="bar">
  <button class="plain plus" id="hide-local" type="button" aria-pressed="false" title="Hide loopback-only ports">+</button>
  <span class="cap brand"><span class="brand-text">Portmap</span><img class="brand-mark" src="/logo-light.png?v={{V}}" alt="Portmap"></span>
  <form class="out" method="post" action="/logout"><button class="plain icon" type="submit" aria-label="Sign out" title="Sign out"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h7"/><path d="M11 12h10"/><path d="M17.5 8.5 21 12l-3.5 3.5"/></svg></button></form>
</header>
<section class="hero">
  <h1>Is port <input id="probe" inputmode="numeric" maxlength="5" placeholder="0000" autocomplete="off" aria-label="Port to check"> free on <span id="host-count">your machines</span>?</h1>
  <div class="cap answer" id="probe-out">Loading…</div>
</section>
<main id="cards"></main>
<div id="lift" aria-hidden="true"></div>
<div class="ticket" id="ticket" hidden role="tooltip"></div>
<button class="plain add-agent" id="add-agent" type="button" aria-haspopup="dialog">+ Add agent</button>
<dialog class="setup" id="setup" aria-labelledby="setup-title">
  <div class="setup-head">
    <span class="cap">Add a machine</span>
    <button class="plain" id="setup-close" type="button" aria-label="Close">Close</button>
  </div>
  <h2 id="setup-title">Three steps on the new machine.</h2>
  <div id="setup-steps"></div>
</dialog>
<div id="outro" aria-hidden="true"><img class="mark only-light" src="/logo-light.png?v={{V}}" alt=""><img class="mark only-dark" src="/logo-dark.png?v={{V}}" alt=""></div>
<script type="module" src="/app.js?v={{V}}"></script>
</body>
</html>

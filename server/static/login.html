<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portmap · Sign in</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script src="/theme.js"></script>
<!-- Warm the cache while the user types: the post-login intro then starts instantly. -->
<link rel="prefetch" href="/app.js?v={{V}}">
<link rel="prefetch" href="/logo.png">
</head>
<body>
<div class="login">
  <header class="bar"><span></span><span class="cap">Portmap</span><span></span></header>
  <form method="post" action="/login" autocomplete="on">
    <img class="logo" src="/icon.png" alt="">
    <h1>Every listening port, on every machine, at a glance.</h1>
    <label class="cap">Username <input name="username" autocomplete="username" required autofocus></label>
    <label class="cap">Password <input name="password" type="password" autocomplete="current-password" required></label>
    <div class="cap err" role="alert">{{ERR}}</div>
    <button type="submit">Sign in</button>
  </form>
</div>
</body>
</html>
